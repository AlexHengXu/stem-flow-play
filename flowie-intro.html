<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowie Intro</title>
<link rel="stylesheet" href="flowie-intro.css">
</head>
<body>
<div id="backdrop"></div>
<div id="viewport">
  <div id="scene">
    <div id="pages"></div>
    <canvas id="spark" width="1536" height="1024"></canvas>
    <div id="dots"><i></i><i></i><i></i><i></i></div>
    <button id="skip" aria-label="Skip intro">Skip<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></button>
    <div id="dialog">
      <div id="box"></div><div id="tail"></div>
      <div id="tag">Flowie</div>
      <div id="text"></div>
      <div id="next"><span id="hint">Click anywhere to continue</span><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#4b57f2"/><path d="M13 17l7 7 7-7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <button id="start">Start<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="#1d1868"/></svg></button>
    </div>
    <div id="veil"></div>
    
  </div>
</div>
<script src="flowie-intro.js?v=4-sequence"></script>
</body>
</html>
