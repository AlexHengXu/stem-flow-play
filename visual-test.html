<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stem Flow · Visual test</title>
<style>body{margin:24px;background:#080b18;color:#eee;font:16px system-ui}h1{font-size:24px}a{color:#bce}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}section{text-align:center}canvas{width:100%;max-width:300px;aspect-ratio:1}input{width:90%}button{padding:10px;margin:12px 8px 12px 0}output{font-variant-numeric:tabular-nums}</style>
<h1>Stem Flow · Team FX visuals</h1><p>Visual design by il2527. Camera-free preview of the renderers used in the game. This page does not play audio.</p><p><a href="index.html">Open game</a> · <a href="fx-test.html">Audio test</a></p><button id="pause">Pause animation</button><span id="cost"></span><main id="grid"></main>
<script src="team-visuals.js"></script><script>
const kinds=['chorus','tremolo','distortion','beat_repeat'],names=['Chorus','Tremolo','Distortion','Beat Repeat'];
const views=kinds.map((kind,i)=>{const el=document.createElement('section');el.innerHTML=`<h2>${names[i]}</h2><canvas width="512" height="512" aria-label="${names[i]} visual"></canvas><p><input type="range" min="0" max="100" value="60" aria-label="${names[i]} amount"><output>60%</output></p>`;grid.append(el);const input=el.querySelector('input');input.oninput=()=>el.querySelector('output').value=input.value+'%';return{ctx:el.querySelector('canvas').getContext('2d'),input,last:null};});
let paused=false,last=0,batch=0,avg=0,frames=0;pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Resume animation':'Pause animation';views.forEach(v=>v.last=null);};
function tick(now){requestAnimationFrame(tick);if(paused||document.hidden){views.forEach(v=>v.last=null);return;}if(now-last<1000/60-.5)return;last=now;const start=performance.now();for(let n=0;n<2;n++){const i=batch++%4,v=views[i],dt=v.last===null?1/30:Math.min(.1,(now-v.last)/1000);v.last=now;v.ctx.setTransform(1,0,0,1,0,0);v.ctx.clearRect(0,0,512,512);StemTeamVisuals.draw(v.ctx,i,kinds[i],'vocals',v.input.value/100,dt);}avg=avg*.9+(performance.now()-start)*.1;if(++frames%30===0)cost.textContent=`Drawing: ${avg.toFixed(1)} ms per batch`;}
requestAnimationFrame(tick);
</script></html>
